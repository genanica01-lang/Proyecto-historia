<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Línea de Tiempo Nicaragua</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-flag"></div>

  <header class="header">
    <h1>Línea de Tiempo Nicaragua</h1>
    <p>Explora los eventos fundamentales de nuestra historia nacional</p>
    <a class="header-quiz-link" href="#quiz">Probar el mini quiz</a>
  </header>

  <main class="timeline-container">
    <div class="timeline" id="timeline">
    </div>
  </main>

  <section class="quiz-section" id="quiz">
    <div class="quiz-card" id="quizCard">
    </div>
  </section>

  <footer class="credits">Bandera de Nicaragua: Wikimedia Commons, autor C records (CC BY 3.0)</footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <button class="close-btn" id="closeModal" aria-label="Cerrar">&times;</button>
      <div id="modalBody">
      </div>
      <button type="button" class="sources-btn" id="sourcesBtn" aria-expanded="false" aria-controls="sourcesPanel">Ver fuentes consultadas <span class="sources-count" id="sourcesCount"></span></button>
      <div class="sources-panel" id="sourcesPanel" hidden>
        <div class="sources-head">
          <h4>Fuentes consultadas</h4>
          <button type="button" class="sources-close" id="sourcesClose" aria-label="Cerrar fuentes">&times;</button>
        </div>
        <ul class="sources-list" id="sourcesList"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
