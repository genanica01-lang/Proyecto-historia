<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Línea de Tiempo Nicaragua</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>


  <div class="bg-flag"></div>

  <header class="header">
    <h1>🇳🇮 Línea de Tiempo Nicaragua</h1>
    <p>Explora 30 eventos fundamentales de nuestra historia nacional</p>
    <a class="header-quiz-link" href="#quiz">Probar el mini quiz</a>
  </header>

  <main class="timeline-container">
    <div class="timeline" id="timeline">
      
    </div>
  </main>

  <section class="quiz-section" id="quiz">
    <div class="quiz-card" id="quizCard">
      
    </div>
  </section>

 
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <button class="close-btn" id="closeModal" aria-label="Cerrar">&times;</button>
      <div id="modalBody">
      
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
